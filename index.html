<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Time</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
    <div id="top-bar">
        <div>
            <img id="logo" src="assets/svgs/logo.svg">
        </div>
        <div>
            <p id="clock">00:00:00</p>
        </div>
    </div>
    <div id="main">
        <div id="next-prayer-container">
            <p>Next prayer :</p>
            <h1 id="next-prayer">Fajr</h1>
            <p id="next-prayer-time">00:00</p>
        </div>
        <div id="progress-bar-container">
            <div id="progress-bar">
                <div id="markers"> 
                    <div class="marker"></div>
                    <div class="marker"></div>
                    <div class="marker"></div>
                </div>
                <div id="bar"></div>
                <div id="progress">
                    <div id="progresses-bar"></div>
                    <div id="progresses-bar-marker"></div>
                </div>
                <div id="progresses-bar-label">
                    <div>
                        <p><br>▲</p>
                        <p id="delta-time-label">-15m</p>
                    </div>
                </div>
            </div>
            <div id="progress-bar-labels">
                <p>-</p>
                <p>+</p>
            </div>
        </div>
    </div>
</body>
</html>
