<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Time</title>
</head>
<body>
    <div id="main">
        <div id="clock-container">
            <h1 id="clock">00:00:00</h1>
        </div>
        <div id="next-prayer-container">
            <p>Next prayer :</p>
            <h2 id="next-prayer">Fajr</h2>
            <p id="next-prayer-time">00:00</p>
        </div>
        <div id="time-progress-bar-container">
            <div id="time-progress-bar-outline">
                <div id="time=progress-bar-fill"></div>
            </div>
            <p id="time-progress-bar-delta">-30m</p>
        </div>
    </div>
</body>
</html>
