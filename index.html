<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 user-scalable=0">
    <title>don't miss</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div id="top-bar" class="container-space-between-row">
        <div class="explicit-flex container-gap">
            <div class="container-centered-row container-border">
                <img id="logo" class="logo" src="assets/svgs/logo.svg" draggable="false">
            </div>
            <button id="preferences-button" class="square-aspect background-white pointer-hover">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
        <div class="container-centered-row container-border">
            <p id="clock" class="no-margin">XX:XX:XX</p>
        </div>
    </div>
    <div id="main" class="container-centered-column">
        <div class="container-centered-column">
            <p id="title" class="p-margin-top-bottom text-align-center">ㅤ</p>
            <h1 id="prayer-name" class="text-align-center">ㅤ</h1>
        </div>
        <div id="progress-bar-container" class="container-centered-column">
            <div class="container-space-between-row container-align-end width-inherit">
                <p id="progress-bar-marker-min" class="text-align-center p-margin-top-bottom color-grey"></p>
                <p id="prayer-time" class="text-align-center p-margin-top-bottom">Fetching schedule...</p>
                <p id="progress-bar-marker-max" class="text-align-center p-margin-top-bottom color-grey"></p>
            </div>
            <div id="progress-bar" class="container-centered-column">
                <div id="progress-bar-marker-container" class="container-space-between-row width-inherit"> 
                    <div class="progress-bar-marker"></div>
                    <div class="progress-bar-marker"></div>
                    <div class="progress-bar-marker"></div>
                </div>
                <div id="bar" class="width-inherit"></div>
                <div id="progress-container" class="width-inherit">
                    <div id="progress" class="bg-color-black smoothed-transition"></div>
                    <div id="progress-marker" class="bg-color-black smoothed-transition"></div>
                </div>
                <div id="progress-marker-label-container" class="container-align-end smoothed-transition">
                    <div id="delta-time-container" class="container-centered-column">
                        <p id="delta-time" class="no-margin text-align-center"></p>
                    </div>
                </div>
            </div>
        </div>
        <div id="next-previous-button-container" class="hidden">
            <button id="next-previous-button" data-mode="next" class="background-white no-select pointer-hover">Next prayer ▶</button>
        </div>
    </div>
    <div id="preferences-menu-screen" class="container-centered-row hidden">
        <div class="preferences-menu background-white">
            <div class="preferences-title">
                <h3 id="locale-preferences-title">Preferences</h3>
                <button id="close-pref-menu" class="square-aspect background-white pointer-hover">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="preferences-options no-scrollbar">
                <div class="preferences-option">
                    <p id="locale-preferences-option-location" class="no-margin">Location</p>
                    <div class="container-centered-space-between-row container-gap">
                        <div id="location-loader" class="loader hidden"></div>
                        <select id="location">
                            <option value="tulungagung">Tulungagung</option>
                            <option value="kediri">Kediri</option>
                            <option value="surabaya">Surabaya</option>
                            <option value="malang">Malang</option>
                            <option value="jogja">Jogja</option>
                            <option value="semarang">Semarang</option>
                            <option value="jakarta">Jakarta</option>
                            <option value="tangerang">Tangerang</option>
                            <option value="bekasi">Bekasi</option>
                            <option value="denpasar">Denpasar</option>
                        </select>
                    </div>
                </div>
                <div class="preferences-option">
                    <p id="locale-preferences-option-language" class="no-margin">Language</p>
                    <div class="container-centered-space-between-row container-gap">
                        <div id="lang-loader" class="loader hidden"></div>
                        <select id="lang">
                            <option value="en">English</option>
                            <option value="id">Indonesia</option>
                        </select>
                    </div>
                </div>
                <div class="preferences-option">
                    <p id="locale-preferences-option-theme" class="no-margin">Theme</p>
                    <div class="container-centered-space-between-row container-gap">
                        <div id="theme-loader" class="loader hidden"></div>
                        <select id="theme">
                            <option id="locale-preferences-theme-light" value="light">Dzuhr Light</option>
                            <option id="locale-preferences-theme-dark" value="dark">Tahajjud Dark</option>
                        </select>
                    </div>
                </div>
                <div class="preferences-option">
                    <p id="locale-preferences-option-prayer-time-adjustment" class="no-margin">Prayer Time Adjustment</p>
                    <div class="container-centered-space-between-row container-gap">
                        <div id="adjustment-loader" class="loader hidden"></div>
                        <select id="adjustment">
                            <option id="locale-preferences-prayer-time-adjustment-neg-5" value="-5">-5 min earlier</option>
                            <option id="locale-preferences-prayer-time-adjustment-neg-4" value="-4">-4 min earlier</option>
                            <option id="locale-preferences-prayer-time-adjustment-neg-3" value="-3">-3 min earlier</option>
                            <option id="locale-preferences-prayer-time-adjustment-neg-2" value="-2">-2 min earlier</option>
                            <option id="locale-preferences-prayer-time-adjustment-neg-1" value="-1">-1 min earlier</option>
                            <option id="locale-preferences-prayer-time-adjustment-zero" value="0" selected>No adjustment</option>
                            <option id="locale-preferences-prayer-time-adjustment-pos-1" value="1">+1 min later</option>
                            <option id="locale-preferences-prayer-time-adjustment-pos-2" value="2">+2 min later</option>
                            <option id="locale-preferences-prayer-time-adjustment-pos-3" value="3">+3 min later</option>
                            <option id="locale-preferences-prayer-time-adjustment-pos-4" value="4">+4 min later</option>
                            <option id="locale-preferences-prayer-time-adjustment-pos-5" value="5">+5 min later</option>
                        </select>
                    </div>
                </div>
                <div class="preferences-option">
                    <p id="locale-preferences-option-detailed-texts" class="no-margin">Detailed Texts</p>
                    <div class="container-centered-space-between-row container-gap">
                        <div id="detailed-texts-mode-loader" class="loader hidden"></div>
                        <label id="locale-preferences-detailed-texts-enabled" class="nowrap no-select pointer-hover">
                            <input type="checkbox" id="detailed-texts-mode">
                            Enabled
                        </label>
                    </div>
                </div>
                <div class="preferences-option">
                    <p id="locale-preferences-option-icons" class="no-margin">Icons</p>
                    <div class="container-centered-space-between-row container-gap">
                        <div id="show-icons-loader" class="loader hidden"></div>
                        <label id="locale-preferences-icons-enabled" class="nowarp no-select pointer-hover">
                            <input type="checkbox" id="show-icons">
                            Enabled
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js" type="module"></script>
</body>
</html>
