<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>don't miss</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
    <div id="top-bar">
        <div class="container-centered-row container-gap">
            <div class="container-centered-row container-border">
                <img class="logo" src="assets/svgs/logo.svg">
            </div>
            <div>
                <label for="location">Location:</label>
                <select id="location">
                    <option value="tulungagung">Tulungagung</option>
                    <option value="kediri">Kediri</option>
                    <option value="surabaya">Surabaya</option>
                    <option value="malang">Malang</option>
                    <option value="jogja">Jogja</option>
                    <option value="semarang">Semarang</option>
                    <option value="jakarta">Jakarta</option>
                    <option value="tangerang">Tangerang</option>
                    <option value="bekasi">Bekasi</option>
                    <option value="denpasar">Denpasar</option>
                </select>
            </div>
        </div>
        <div class="container-centered-row container-border">
            <p id="clock" class="no-margin">XX:XX:XX</p>
        </div>
    </div>
    <div id="main" class="container-centered-column">
        <div class="container-centered-column">
            <p id="title" class="p-margin-top-bottom text-align-center">ㅤ</p>
            <h1 id="prayer-name" class="text-align-center">ㅤ</h1>
        </div>
        <div id="progress-bar-container" class="container-centered-column">
            <div class="container-space-between-row container-align-end width-inherit">
                <p class="text-align-center p-margin-top-bottom color-grey">-30 min</p>
                <p id="prayer-time" class="text-align-center p-margin-top-bottom">Fetching schedule...</p>
                <p class="text-align-center p-margin-top-bottom color-grey">+30 min</p>
            </div>
            <div id="progress-bar" class="container-centered-column">
                <div id="progress-bar-marker-container" class="container-space-between-row width-inherit"> 
                    <div class="progress-bar-marker"></div>
                    <div class="progress-bar-marker"></div>
                    <div class="progress-bar-marker"></div>
                </div>
                <div id="bar" class="width-inherit"></div>
                <div id="progress-container" class="width-inherit">
                    <div id="progress" class="bg-color-black"></div>
                    <div id="progress-marker" class="bg-color-black"></div>
                </div>
                <div id="progress-marker-label-container">
                    <div id="delta-time-container">
                        <p id="delta-time" class="no-margin text-align-center"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
