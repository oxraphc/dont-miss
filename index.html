<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>don't miss</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
    <div id="top-bar">
        <div id="top-bar-left">
            <div class="top-bar-div-border">
                <img id="logo" src="assets/svgs/logo.svg">
            </div>
            <div>
                <label for="location">Location:</label>
                <select id="location">
                    <option value="tulungagung">Tulungagung</option>
                    <option value="kediri">Kediri</option>
                    <option value="surabaya">Surabaya</option>
                    <option value="malang">Malang</option>
                    <option value="jogja">Jogja</option>
                    <option value="semarang">Semarang</option>
                    <option value="jakarta">Jakarta</option>
                    <option value="tangerang">Tangerang</option>
                    <option value="bekasi">Bekasi</option>
                    <option value="denpasar">Denpasar</option>
                </select>
            </div>
        </div>
        <div class="top-bar-div-border">
            <p id="clock">XX:XX:XX</p>
        </div>
    </div>
    <div id="main">
        <div id="next-prayer-container">
            <p id="next-title">ㅤ</p>
            <h1 id="next-prayer">ㅤ</h1>
            <div id="progress-bar-labels">
                <p class="progress-bar-label">-30 min</p>
                <p id="next-prayer-time">Fetching schedule...</p>
                <p class="progress-bar-label">+30 min</p>
            </div>
        </div>
        <div id="progress-bar-container">
            <div id="progress-bar">
                <div id="markers"> 
                    <div class="marker"></div>
                    <div class="marker"></div>
                    <div class="marker"></div>
                </div>
                <div id="bar"></div>
                <div id="progress">
                    <div id="progresses-bar"></div>
                    <div id="progresses-bar-marker"></div>
                </div>
                <div id="progresses-bar-label">
                    <div id="label-container">
                        <p id="delta-time-label"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
