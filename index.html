<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Time</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
    <div id="main">
        <div id="clock-container">
            <h1 id="clock">00:00:00</h1>
        </div>
        <div id="next-prayer-container">
            <p>Next prayer :</p>
            <h2 id="next-prayer">Fajr</h2>
            <p id="next-prayer-time">00:00</p>
        </div>
        <div id="progress-bar-container">
            <div id="progress-bar">
                <div id="markers"> 
                    <div class="marker"></div>
                    <div class="marker"></div>
                    <div class="marker"></div>
                </div>
                <div id="bar"></div>
                <div id="progress">
                    <div class="bar" id="progresses-bar"></div>
                    <div id="progresses-bar-marker"></div>
                </div>
            </div>
            <div id="progress-bar-labels">
                <p>-30</p>
                <p>+30</p>
            </div>
        </div>
    </div>
</body>
</html>
